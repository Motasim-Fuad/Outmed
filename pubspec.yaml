name: outmed
description: B2B medical supply marketplace for healthcare buyers and suppliers.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  bloc: ^9.2.1
  cached_network_image: ^4.0.3
  connectivity_plus: ^7.3.2
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.11.1
  equatable: ^3.0.0
  firebase_analytics: ^12.6.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  firebase_performance: ^0.11.6
  firebase_remote_config: ^6.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.5
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_stripe: ^14.1.0
  flutter_svg: ^2.3.0
  geolocator: ^14.0.1
  get_it: ^9.3.0
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  injectable: ^3.0.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  shimmer: ^4.0.0
  sign_in_with_apple: ^8.2.0
  sqflite: ^2.4.4+2
  workmanager: ^0.10.10

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/AppIcon.jpg
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
